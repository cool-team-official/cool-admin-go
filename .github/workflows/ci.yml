name: CI

# 质量检查(手动触发):已停用 master push / PR 自动执行。
# 原因:多模块 Monorepo 发版时,bump 提交会把根 go.mod 内部依赖升到新版本(如 v1.5.12),
# 而各子模块同名 tag 要等 release.yml 的 Job1(打主标签后)才创建 —— push master 即自动
# 构建必然报 unknown revision 而红,门禁失去意义并阻碍发版。
# 需要全量 build + vet 时,在 Actions 页手动 Run workflow(子模块 tag 就绪后即可全绿);
# 想恢复自动门禁,把 on: 段加回 push / pull_request 即可。
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go build & vet (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 多模块仓库使用 go.work 把本地子模块串起来,否则各模块会去远端拉旧版本依赖
      - name: Init Go workspace
        run: |
          go work init
          go work use -r .

      # 遍历所有含 go.mod 的目录逐一编译(仓库根模块由 go build ./... 覆盖)
      - name: Build all modules
        run: |
          set -euo pipefail
          go build ./...
          mods=$(find . -name go.mod -not -path './.devcontainer/*' -printf '%h\n' | sort)
          for d in $mods; do
            echo "==> go build ./... ($d)"
            go -C "$d" build ./...
          done

      - name: Vet all modules
        run: |
          set -euo pipefail
          go vet ./...
          mods=$(find . -name go.mod -not -path './.devcontainer/*' -printf '%h\n' | sort)
          for d in $mods; do
            echo "==> go vet ./... ($d)"
            go -C "$d" vet ./...
          done
